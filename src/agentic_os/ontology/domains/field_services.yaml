name: field-services
description: >
  A small field-services company. Customers own sites. Work orders are raised
  at sites. Technicians are assigned to work orders. Invoices bill work orders.

entity_types:
  - name: customer
    description: A business that buys maintenance services.
    attributes:
      name: str
      tier: str
      contact_email: str
  - name: site
    description: A physical location owned by a customer.
    attributes:
      address: str
      access_notes: str
  - name: work_order
    description: A request to fix or service equipment at a site.
    attributes:
      summary: str
      status: str          # open, scheduled, done, cancelled
      priority: str        # low, normal, high
      scheduled_date: str
  - name: technician
    description: A field engineer who carries out work orders.
    attributes:
      name: str
      skills: list
      home_base: str
  - name: invoice
    description: A bill for a completed or scheduled work order.
    attributes:
      amount: float
      currency: str
      status: str          # draft, sent, paid

relation_types:
  - name: belongs_to
    source: site
    target: customer
    description: A site belongs to a customer.
  - name: raised_at
    source: work_order
    target: site
    description: A work order is raised at a site.
  - name: assigned_to
    source: work_order
    target: technician
    description: A work order is assigned to a technician.
  - name: bills
    source: invoice
    target: work_order
    description: An invoice bills a work order.

