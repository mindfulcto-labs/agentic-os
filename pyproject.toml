[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-os"
version = "0.1.0"
description = "A reference implementation of an ontology-driven agentic AI operating system with governance in the runtime."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Venkatesan Ramachandran", email = "venkat@rvenkat.com" }]
keywords = ["agents", "governance", "ontology", "llm", "policy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
agentic-os = "agentic_os.cli:main"

[project.urls]
Homepage = "https://github.com/mindfulcto-labs/agentic-os"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_os"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
